name: ci

# The core library has no external dependencies precisely so that this can run on
# all three targets from the first commit. An architecture claimed to be portable
# but never compiled on the other OS is a fiction; this is what makes it true.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest }
          - { name: macos,   os: macos-latest }
          - { name: windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure
